<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Browser | GoF Patterns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <a class="brand" href="../index.html">GoF Patterns</a>
        </div>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="../index.html">Home</a>
          <a href="../index.html#patterns">Patterns</a>
          <a href="./index.html" class="active">Notes</a>
        </nav>
      </header>

      <main class="notes-layout">
        <aside class="sidebar" aria-label="Markdown files">
          <div class="sidebar-header">
            <p class="eyebrow">Garden notes</p>
            <h1>Browse the archive</h1>
          </div>
          <div id="notes-tree" class="notes-tree"></div>
        </aside>

        <section class="reader" aria-live="polite">
          <div id="reader-content" class="reader-content markdown-body">
            <p class="loading">Loading notes…</p>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="./notes.js"></script>
  </body>
</html>
