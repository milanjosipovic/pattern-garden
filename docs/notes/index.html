<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes Browser | GoF Patterns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <a class="brand" href="../index.html">GoF Patterns</a>
        </div>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="Toggle navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Main navigation">
          <a href="../index.html">Home</a>
          <a href="../index.html#patterns">Patterns</a>
          <a class="active" href="./index.html">Notes</a>
        </nav>
      </header>

      <main class="notes-layout">
        <aside class="sidebar" aria-label="Markdown files">
          <div class="sidebar-header">
            <p class="eyebrow">Garden notes</p>
            <div class="sidebar-title-row">
              <h1>Browse the archive</h1>
              <button
                class="sidebar-toggle"
                type="button"
                aria-expanded="false"
                aria-label="Toggle archive list"
              >
                <span class="sidebar-toggle-icon" aria-hidden="true">▾</span>
              </button>
            </div>
          </div>
          <div id="notes-tree" class="notes-tree"></div>
        </aside>

        <section class="reader" aria-live="polite">
          <div id="reader-content" class="reader-content markdown-body">
            <p class="loading">Loading notes…</p>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="./notes.js"></script>
    <script>
      const navToggle = document.querySelector(".nav-toggle");
      const nav = document.getElementById("site-nav");
      const sidebarToggle = document.querySelector(".sidebar-toggle");
      const sidebar = document.querySelector(".sidebar");

      if (sidebarToggle && sidebar) {
        sidebarToggle.addEventListener("click", () => {
          const isOpen = sidebar.classList.toggle("open");
          sidebarToggle.setAttribute("aria-expanded", String(isOpen));
        });
      }

      function setMobileNavState(isOpen) {
        if (nav) {
          nav.classList.toggle("open", isOpen);
        }
        if (navToggle) {
          navToggle.setAttribute("aria-expanded", String(isOpen));
        }
        document.body.classList.toggle("menu-open", isOpen);

        const main = document.querySelector("main");
        const footer = document.querySelector(".footer");
        if (main) {
          main.style.opacity = isOpen ? "0.22" : "";
          main.style.filter = isOpen ? "blur(0.5px)" : "";
          main.style.pointerEvents = isOpen ? "none" : "";
        }
        if (footer) {
          footer.style.opacity = isOpen ? "0.22" : "";
          footer.style.filter = isOpen ? "blur(0.5px)" : "";
          footer.style.pointerEvents = isOpen ? "none" : "";
        }
      }

      if (navToggle && nav) {
        navToggle.addEventListener("click", (event) => {
          event.stopPropagation();
          setMobileNavState(!nav.classList.contains("open"));
        });

        nav.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => {
            setMobileNavState(false);
          });
        });

        document.addEventListener(
          "click",
          (event) => {
            const target = event.target;
            if (!(target instanceof Node)) return;

            if (target.closest(".note-link")) {
              setMobileNavState(false);
              return;
            }

            const clickedInsideNav = nav.contains(target);
            const clickedToggle = navToggle.contains(target);

            if (
              nav.classList.contains("open") &&
              !clickedInsideNav &&
              !clickedToggle
            ) {
              setMobileNavState(false);
            }
          },
          true,
        );

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && nav.classList.contains("open")) {
            setMobileNavState(false);
          }
        });
      }
    </script>
  </body>
</html>
