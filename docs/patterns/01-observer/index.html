<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terrarium — Observer Pattern</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Terrarium</h1>
      <p class="app-subtitle">
        One shared state. Three independent widgets watching it.
        None of them watching each other.
      </p>
    </header>

    <main class="stage">
      <div class="plant" id="plant" data-status="thriving">
        <svg class="plant-svg" viewBox="0 0 240 260" aria-hidden="true">
          <defs>
            <radialGradient id="sunGlow" cx="50%" cy="20%" r="60%">
              <stop offset="0%" stop-color="var(--accent-gold)" stop-opacity="0.55" />
              <stop offset="100%" stop-color="var(--accent-gold)" stop-opacity="0" />
            </radialGradient>
          </defs>

          <circle class="plant-glow" cx="120" cy="70" r="90" fill="url(#sunGlow)" />

          <ellipse class="jar-base" cx="120" cy="248" rx="92" ry="9" />
          <path class="jar-glass" d="M40 245 C40 120 60 40 120 40 C180 40 200 120 200 245" />
          <ellipse class="jar-mist" cx="120" cy="150" rx="80" ry="95" />

          <ellipse class="soil" cx="120" cy="242" rx="55" ry="10" />

          <g class="plant-body">
            <path class="stem" d="M120 240 C 116 195, 124 150, 120 110" />
            <path class="leaf" d="M0,0 Q15,-10 30,0 Q15,10 0,0 Z" transform="translate(108,220) rotate(200)" />
            <path class="leaf" d="M0,0 Q15,-10 30,0 Q15,10 0,0 Z" transform="translate(132,214) rotate(-20)" />
            <path class="leaf" d="M0,0 Q15,-10 30,0 Q15,10 0,0 Z" transform="translate(106,170) rotate(195)" />
            <path class="leaf" d="M0,0 Q15,-10 30,0 Q15,10 0,0 Z" transform="translate(134,164) rotate(-25)" />
            <circle class="flower" cx="120" cy="108" r="9" />
            <circle class="flower-center" cx="120" cy="108" r="3" />
          </g>
        </svg>
        <p class="plant-status-label" id="plant-status-label">Thriving</p>
      </div>

      <div class="controls">
        <label class="control">
          <span class="control-label">☀️ Sunlight <output id="sunlight-value">50</output></span>
          <input type="range" id="sunlight-slider" min="0" max="100" value="50" />
        </label>
        <label class="control">
          <span class="control-label">💧 Water <output id="water-value">50</output></span>
          <input type="range" id="water-slider" min="0" max="100" value="50" />
        </label>
      </div>
    </main>

    <aside class="sidebar">
      <section class="card gauge" id="gauge" data-status="thriving">
        <h2>Health</h2>
        <div class="gauge-track">
          <div class="gauge-fill" id="gauge-fill"></div>
        </div>
        <p class="gauge-readout">
          <span id="gauge-score">80</span><span class="gauge-max">/100</span>
          — <span id="gauge-label">Thriving</span>
        </p>
      </section>

      <section class="card journal">
        <h2>Growth journal</h2>
        <ul class="journal-list" id="journal-list"></ul>
      </section>
    </aside>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
