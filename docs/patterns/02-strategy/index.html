<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 - Strategy</title>
    <style>
      :root {
        --bg: #111d1a;
        --panel: #1c2c27;
        --panel-border: rgba(255,255,255,0.08);
        --text: #eef7f0;
        --muted: #afc5b7;
        --accent: #8ecf99;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a2d29, var(--bg));
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .card {
        width: min(760px, 90vw);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      }
      h1 { margin-top: 0; }
      p { color: var(--muted); line-height: 1.6; }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
